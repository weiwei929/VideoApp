{% extends 'pikpak/base.html' %}
{% load static %}

{% block title %}播放 {{ filename }} - VideoApp{% endblock %}

{% block extra_css %}
<link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
<style>
    .video-container {
        position: relative;
        width: 100%;
        height: calc(100vh - 150px);
        min-height: 400px;
        background-color: #000;
    }
    
    .vjs-custom-skin {
        width: 100%;
        height: 100%;
    }
    
    .vjs-custom-skin .vjs-big-play-button {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-truncate">{{ filename }}</h2>
        <div>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> 返回
            </a>
        </div>
    </div>
    
    <div class="video-container">
        <video id="pikpak-player" class="video-js vjs-custom-skin vjs-big-play-centered" controls preload="auto">
            <p class="vjs-no-js">
                要查看此视频，请启用JavaScript，并考虑升级到支持HTML5视频的Web浏览器
            </p>
        </video>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 初始化VideoJS播放器
        var player = videojs('pikpak-player', {
            controls: true,
            autoplay: false,
            preload: 'auto',
            fluid: false,
            playbackRates: [0.5, 1, 1.25, 1.5, 2],
            responsive: true,
            html5: {
                vhs: {
                    overrideNative: true
                },
                nativeAudioTracks: false,
                nativeVideoTracks: false
            }
        });
        
        // 设置视频源
        player.src({
            src: "{{ stream_url }}",
            type: detectMimeType("{{ filename }}")
        });
        
        // 基于文件名检测MIME类型
        function detectMimeType(filename) {
            const extension = filename.split('.').pop().toLowerCase();
            const mimeTypes = {
                'mp4': 'video/mp4',
                'mkv': 'video/x-matroska',
                'avi': 'video/x-msvideo',
                'webm': 'video/webm',
                'mov': 'video/quicktime',
                'm4v': 'video/mp4',
                'flv': 'video/x-flv',
                'wmv': 'video/x-ms-wmv',
                'mpg': 'video/mpeg',
                'mpeg': 'video/mpeg',
                'ts': 'video/mp2t',
                '3gp': 'video/3gpp',
                'ogv': 'video/ogg'
            };
            
            return mimeTypes[extension] || 'video/mp4';
        }
        
        // 优化播放器设置
        player.on('loadedmetadata', function() {
            console.log('视频元数据已加载');
        });
        
        player.on('error', function(e) {
            console.error('视频播放错误:', player.error());
        });
    });
</script>
{% endblock %}
