{% extends 'pikpak/base.html' %}

{% block title %}配置PikPak WebDAV - VideoApp{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">配置PikPak WebDAV连接</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="alert alert-info">
                            <p>请输入您的PikPak WebDAV服务器信息：</p>
                            <ul>
                                <li>WebDAV URL通常为：<code>https://mypikpak.com/drive/webdav</code></li>
                                <li>用户名为您的PikPak账户邮箱</li>
                                <li>密码为您的PikPak账户密码</li>
                            </ul>
                        </div>
                        
                        <div class="mb-3">
                            <label for="webdav_url" class="form-label">WebDAV URL</label>
                            <input type="url" class="form-control" id="webdav_url" name="webdav_url" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="webdav_username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="webdav_username" name="webdav_username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="webdav_password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="webdav_password" name="webdav_password" required>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">连接</button>
                            <a href="{% url 'pikpak:home' %}" class="btn btn-secondary">返回</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
