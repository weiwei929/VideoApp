<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放 {{ filename }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <!-- 引入Netflix风格CSS -->
    <link href="/static/pikpak/css/netflix-theme.css" rel="stylesheet">
    <style>
        /* 自适应视频容器 - 调整尺寸更合理 */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1280px; /* 限制最大宽度 */
            margin: 0 auto; /* 居中显示 */
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            overflow: hidden;
        }
        
        /* 横屏模式 - 优化比例 */
        .video-container.landscape {
            aspect-ratio: 16/9;
            height: auto;
            max-height: 60vh; /* 减小最大高度 */
        }
        
        /* 竖屏模式 - 优化比例 */
        .video-container.portrait {
            aspect-ratio: 9/16;
            width: 60%; /* 减小宽度 */
            max-height: 70vh;
        }
        
        /* 视频播放器适应容器 */
        .video-js {
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        /* 移动设备响应式调整 */
        @media (max-width: 768px) {
            .video-container.landscape {
                width: 100%;
                max-height: 50vh;
            }
            
            .video-container.portrait {
                width: 80%;
                max-height: 60vh;
            }
        }

        /* 确保控制栏可见 */
        .video-js .vjs-control-bar {
            display: flex !important;
            opacity: 1 !important;
            visibility: visible !important;
        }
        
        /* 视频旋转类 */
        .video-rotate-90 .vjs-tech {
            transform: rotate(90deg) scale(1.33);
        }
        
        .video-rotate-180 .vjs-tech {
            transform: rotate(180deg);
        }
        
        .video-rotate-270 .vjs-tech {
            transform: rotate(270deg) scale(1.33);
        }
        
        /* 控制栏不旋转 */
        .video-rotate-90 .vjs-control-bar,
        .video-rotate-180 .vjs-control-bar,
        .video-rotate-270 .vjs-control-bar {
            transform: none;
        }
        
        /* 视频信息区域 */
        .video-info {
            padding: 1rem 0;
        }
        
        /* 功能按钮 */
        .function-btn {
            margin-right: 10px;
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #444444;
        }
        
        .function-btn:hover {
            background-color: #444444;
            color: #ffffff;
        }
        
        /* 返回主页按钮 */
        .back-to-main {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background-color: rgba(229, 9, 20, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        /* 视频元数据标签 */
        .info-badge {
            background-color: rgba(255, 255, 255, 0.1);
            color: #b3b3b3;
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            margin-right: 0.5rem;
            font-size: 0.8rem;
        }

        /* 返回按钮突出显示 */
        .btn-return {
            background-color: #333333;
            border-color: #444444;
            color: #ffffff;
            transition: all 0.3s;
        }
        
        .btn-return:hover {
            background-color: #e50914;
            border-color: #e50914;
            color: #ffffff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <!-- 添加返回主页悬浮按钮 -->
    <a href="/" class="back-to-main" title="返回主页">
        <i class="bi bi-house-fill"></i>
    </a>

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pikpak/">PikPak</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/pikpak/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pikpak/browse/">浏览文件</a>
                    </li>
                </ul>
                <!-- 添加右侧返回主页链接 -->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-house-door me-1"></i>返回主应用
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 消息提示 -->
    <div class="container-fluid mt-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- 主内容 -->
    <div class="container-fluid">
        <!-- 视频播放区 - 添加内边距使布局更舒适 -->
        <div class="py-3">
            <div class="video-container landscape" id="video-container">
                <video id="pikpak-player" class="video-js vjs-big-play-centered" controls preload="auto">
                    <p class="vjs-no-js">
                        要查看此视频，请启用JavaScript，并考虑升级到支持HTML5视频的Web浏览器
                    </p>
                </video>
            </div>
        </div>
        
        <!-- 视频信息区 -->
        <div class="video-info">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h1 class="fs-2">{{ filename }}</h1>
                    <div class="d-flex flex-wrap mt-2">
                        <span class="info-badge"><i class="bi bi-film"></i> 视频</span>
                        <span class="info-badge" id="video-format"></span>
                        <span class="info-badge" id="video-resolution"></span>
                    </div>
                </div>
                <div>
                    <!-- 增强返回按钮 -->
                    <a href="/pikpak/browse/" class="btn btn-return me-2">
                        <i class="bi bi-arrow-left"></i> 返回文件列表
                    </a>
                    <a href="javascript:history.back()" class="btn btn-return">
                        <i class="bi bi-reply"></i> 返回上页
                    </a>
                </div>
            </div>
            
            <!-- 视频控制功能 -->
            <div class="mb-4">
                <button class="btn function-btn" id="rotate-btn" title="旋转视频 (Alt+K)">
                    <i class="bi bi-arrow-clockwise"></i> 旋转视频
                </button>
                <button class="btn function-btn" id="aspect-btn" title="切换横/竖屏模式">
                    <i class="bi bi-display"></i> 横屏模式
                </button>
                <button class="btn function-btn" id="speed-btn" title="调整播放速度">
                    <i class="bi bi-speedometer2"></i> 速度: 1.0x
                </button>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="mt-5 py-3" style="background-color: rgba(0,0,0,0.3);">
        <div class="container text-center">
            <p class="text-muted mb-0">PikPak云盘 &copy; 2025 | <a href="/" class="text-muted">返回主应用</a> | <a href="/pikpak/browse/" class="text-muted">返回文件列表</a></p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化播放器 - 调整设置以改善自适应
            var player = videojs('pikpak-player', {
                controls: true,
                autoplay: false,
                preload: 'auto',
                fluid: true,
                fill: false, /* 设为false避免填满容器 */
                aspectRatio: '16:9',
                responsive: true,
                playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
                controlBar: {
                    children: [
                        'playToggle',
                        'volumePanel',
                        'currentTimeDisplay',
                        'timeDivider',
                        'durationDisplay',
                        'progressControl',
                        'playbackRateMenuButton',
                        'fullscreenToggle'
                    ],
                    autoHide: false
                }
            });
            
            // 设置视频源
            player.src({
                src: "{{ stream_url }}",
                type: detectMimeType("{{ filename }}")
            });
            
            // 基于文件名检测MIME类型
            function detectMimeType(filename) {
                const extension = filename.split('.').pop().toLowerCase();
                const mimeTypes = {
                    'mp4': 'video/mp4',
                    'mkv': 'video/x-matroska',
                    'avi': 'video/x-msvideo',
                    'webm': 'video/webm',
                    'mov': 'video/quicktime',
                    'm4v': 'video/mp4',
                    'flv': 'video/x-flv',
                    'wmv': 'video/x-ms-wmv',
                    'mpg': 'video/mpeg',
                    'mpeg': 'video/mpeg',
                    'ts': 'video/mp2t',
                    '3gp': 'video/3gpp',
                    'ogv': 'video/ogg'
                };
                
                // 更新视频格式标签
                document.getElementById('video-format').textContent = extension.toUpperCase();
                
                return mimeTypes[extension] || 'video/mp4';
            }
            
            // 视频旋转功能
            const rotateBtn = document.getElementById('rotate-btn');
            const playerEl = document.getElementById('pikpak-player');
            let currentRotation = 0;
            
            rotateBtn.addEventListener('click', function() {
                // 移除之前的旋转类
                if (currentRotation > 0) {
                    playerEl.classList.remove(`video-rotate-${currentRotation}`);
                }
                
                // 计算新的旋转角度
                currentRotation = (currentRotation + 90) % 360;
                
                // 添加新的旋转类
                if (currentRotation > 0) {
                    playerEl.classList.add(`video-rotate-${currentRotation}`);
                }
                
                // 更新按钮文字
                this.innerHTML = `<i class="bi bi-arrow-clockwise"></i> 已旋转 ${currentRotation}°`;
                
                // 如果是90度或270度，调整为竖屏模式
                const videoContainer = document.getElementById('video-container');
                const aspectBtn = document.getElementById('aspect-btn');
                
                if (currentRotation === 90 || currentRotation === 270) {
                    videoContainer.classList.remove('landscape');
                    videoContainer.classList.add('portrait');
                    aspectBtn.innerHTML = '<i class="bi bi-phone"></i> 竖屏模式';
                } else {
                    videoContainer.classList.remove('portrait');
                    videoContainer.classList.add('landscape');
                    aspectBtn.innerHTML = '<i class="bi bi-display"></i> 横屏模式';
                }
                
                // 触发播放器布局更新
                setTimeout(() => player.trigger('resize'), 100);
            });
            
            // 横竖屏切换功能
            const aspectBtn = document.getElementById('aspect-btn');
            const videoContainer = document.getElementById('video-container');
            
            aspectBtn.addEventListener('click', function() {
                if (videoContainer.classList.contains('landscape')) {
                    videoContainer.classList.remove('landscape');
                    videoContainer.classList.add('portrait');
                    this.innerHTML = '<i class="bi bi-phone"></i> 竖屏模式';
                } else {
                    videoContainer.classList.remove('portrait');
                    videoContainer.classList.add('landscape');
                    this.innerHTML = '<i class="bi bi-display"></i> 横屏模式';
                }
                
                // 触发播放器布局更新
                setTimeout(() => player.trigger('resize'), 100);
            });
            
            // 播放速度控制
            const speedBtn = document.getElementById('speed-btn');
            const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
            let currentSpeedIndex = 2; // 默认1.0x
            
            speedBtn.addEventListener('click', function() {
                // 计算下一个速度索引
                currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
                const newSpeed = speeds[currentSpeedIndex];
                
                // 设置新速度
                player.playbackRate(newSpeed);
                
                // 更新按钮文字
                this.innerHTML = `<i class="bi bi-speedometer2"></i> 速度: ${newSpeed}x`;
            });
            
            // 监听视频元数据加载
            player.on('loadedmetadata', function() {
                const videoWidth = player.videoWidth();
                const videoHeight = player.videoHeight();
                
                if (videoWidth && videoHeight) {
                    document.getElementById('video-resolution').textContent = `${videoWidth}×${videoHeight}`;
                    
                    // 自动检测视频方向
                    if (videoHeight > videoWidth) {
                        // 竖屏视频
                        videoContainer.classList.remove('landscape');
                        videoContainer.classList.add('portrait');
                        aspectBtn.innerHTML = '<i class="bi bi-phone"></i> 竖屏模式';
                    }
                    
                    // 设置合适的容器大小
                    const aspectRatio = videoWidth / videoHeight;
                    
                    if (aspectRatio > 2.5) {
                        // 超宽视频，可能是全景视频
                        videoContainer.style.maxWidth = '90%';
                        videoContainer.style.maxHeight = '50vh';
                    } else if (aspectRatio < 0.5) {
                        // 超窄视频，可能是垂直拍摄的手机视频
                        videoContainer.style.width = '50%';
                        videoContainer.style.maxHeight = '75vh';
                    }
                    
                    // 触发播放器布局更新
                    setTimeout(() => player.trigger('resize'), 100);
                }
            });
            
            // 添加键盘快捷键
            document.addEventListener('keydown', function(e) {
                // Alt+K 旋转视频
                if (e.altKey && e.code === 'KeyK') {
                    rotateBtn.click();
                    e.preventDefault();
                }
                
                // 空格键播放/暂停
                if (e.code === 'Space' && !e.target.matches('input, textarea, button')) {
                    if (player.paused()) {
                        player.play();
                    } else {
                        player.pause();
                    }
                    e.preventDefault();
                }
                
                // 左右箭头快进/快退
                if (e.code === 'ArrowLeft') {
                    player.currentTime(player.currentTime() - 10);
                    e.preventDefault();
                }
                if (e.code === 'ArrowRight') {
                    player.currentTime(player.currentTime() + 10);
                    e.preventDefault();
                }
                
                // Esc键返回
                if (e.code === 'Escape' && !player.isFullscreen()) {
                    window.location.href = '/pikpak/browse/';
                    e.preventDefault();
                }
            });
            
            // 监听窗口变化触发布局重新计算
            window.addEventListener('resize', function() {
                setTimeout(() => player.trigger('resize'), 100);
            });
            
            // 确保控制栏可见
            player.on('useractive userinactive', function() {
                const controlBar = player.controlBar.el();
                if (controlBar) {
                    controlBar.style.opacity = '1';
                    controlBar.style.visibility = 'visible';
                }
            });
        });
    </script>
</body>
</html>
