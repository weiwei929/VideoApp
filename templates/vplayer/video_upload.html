{% extends 'base.html' %}

{% block title %}上传视频 - VideoApp{% endblock %}

{% block extra_css %}
<style>
    .form-control {
        background-color: #222;
        border-color: #444;
        color: #eee;
    }
    .form-control:focus {
        background-color: #333;
        border-color: #666;
        color: #fff;
    }
    .form-text {
        color: #aaa !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h1 class="mb-4 text-info">上传视频</h1>
        
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        <strong>表单有错误，请修正以下问题：</strong>
                        {{ form.errors }}
                    </div>
                    {% endif %}
                    
                    <div class="mb-3">
                        <label for="{{ form.title.id_for_label }}" class="form-label text-light">标题</label>
                        <input type="text" name="title" id="{{ form.title.id_for_label }}" class="form-control" value="{{ form.title.value|default:'' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="{{ form.description.id_for_label }}" class="form-label text-light">描述</label>
                        <textarea name="description" id="{{ form.description.id_for_label }}" class="form-control" rows="3">{{ form.description.value|default:'' }}</textarea>
                    </div>
                    
                    <div class="mb-4">
                        <label for="{{ form.video_file.id_for_label }}" class="form-label text-light">视频文件</label>
                        <input type="file" name="video_file" id="{{ form.video_file.id_for_label }}" class="form-control" accept="video/*" required>
                        <div class="form-text">支持的格式: mp4, mkv, avi, mov, webm, flv</div>
                        <div class="form-text">系统将自动从视频中提取首帧作为缩略图</div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'vplayer:video_list' %}" class="btn btn-outline-light">取消</a>
                        <button type="submit" class="btn btn-danger">上传视频</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
