{% extends 'base.html' %}

{% block title %}删除视频 - VideoApp{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-body text-center">
                <h3 class="text-danger mb-4">确认删除</h3>
                <p class="text-light">您确定要删除视频 "{{ object.title }}" 吗？此操作无法撤销。</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center mt-4">
                        <a href="{% url 'vplayer:video_detail' object.pk %}" class="btn btn-outline-light me-3">取消</a>
                        <button type="submit" class="btn btn-danger">确认删除</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
