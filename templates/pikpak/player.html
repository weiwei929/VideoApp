{% extends 'base.html' %}

{% block title %}播放 {{ file.name }} - VideoApp{% endblock %}

{% block extra_css %}
<link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
<style>
    .video-container {
        position: relative;
        width: 100%;
        background: #000;
        border-radius: 6px;
        overflow: hidden;
    }
    .video-js {
        width: 100%;
        height: 0;
        padding-top: 56.25%;
    }
    .file-info {
        background-color: #181818;
        border-radius: 6px;
        padding: 20px;
        margin-top: 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'pikpak:files' %}" class="text-decoration-none text-muted">
        <i class="bi bi-arrow-left"></i> 返回文件列表
    </a>
</div>

<div class="video-container">
    <video
        id="pikpak-player"
        class="video-js vjs-big-play-centered vjs-theme-netflix"
        controls
        preload="auto"
        data-setup="{}"
    >
        <source src="{{ file.url }}" type="{{ file.type }}">
        <p class="vjs-no-js">
            要查看此视频，请启用JavaScript，并考虑升级到支持HTML5视频的浏览器
        </p>
    </video>
</div>

<div class="file-info">
    <h1>{{ file.name }}</h1>
    <p class="text-muted">大小: {{ file.size }}</p>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    var player = videojs('pikpak-player');
</script>
{% endblock %}
